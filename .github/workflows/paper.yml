name: Build paper

on:
  push:
    paths:
      - 'paper/**'
      - '.github/workflows/paper.yml'
  pull_request:
    paths:
      - 'paper/**'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: wtfjoke/setup-tectonic@v3
        with:
          tectonic-version: 0.17.0

      - name: Cache Tectonic resources
        uses: actions/cache@v4
        with:
          path: ~/.cache/tectonic
          key: tectonic-bundle-v33-${{ runner.os }}-0.17.0

      - name: Compile paper
        working-directory: paper
        run: |
          for attempt in 1 2 3; do
            tectonic -X compile main.tex && exit 0
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          exit 1

      - name: Check generated PDF is present
        working-directory: paper
        run: test -s main.pdf
